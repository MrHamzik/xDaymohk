# Supabase project configuration.
#
# Generated by `supabase init`. Apply with `supabase link --project-ref <ref>`
# then `supabase db push` to apply migrations to the linked project.
#
# Minimal config — we rely on the Supabase dashboard for auth providers,
# realtime settings, and storage quotas. The CLI is used only for migration
# management here.

project_id = "daimohk"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"
image_transformation = { enabled = true }

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://daymohk.vercel.app"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.google]
enabled = false # Configure in Supabase dashboard; OAuth secrets stay there.
client_id = ""
secret = ""
redirect_uri = ""

[edge_runtime]
enabled = true
